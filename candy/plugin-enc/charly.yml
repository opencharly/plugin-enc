plugin-enc:
    candy:
        description: |-
            ENCRYPTED-VOLUME (gocryptfs) MECHANICS plugin (C16a) — runs the gocryptfs /
            systemd-run --scope / fusermount3 shell mechanics that mount, unmount,
            initialize (auto-init on charly start), and re-key charly's gocryptfs-backed
            encrypted volumes. It is the security-sensitive external-command surface carved
            out of charly core (the former charly/enc.go is DELETED, K-wave 2). The deploy-model
            around it — ResolvedBindMount / ResolveVolumeBacking (sdk/deploykit/deploy_volume.go),
            the config loader (LoadEncryptedVolume, sdk/deploykit/enc_probe.go), the path/probe
            helpers, and the credential store — is sdk/deploykit + plugin-side, and the enc shim
            (candy/plugin-pod/enc_cmd.go) host-prelifts a self-contained per-volume plan +
            resolved passphrase into this plugin's OpExecute. Compiled-in (charly config
            mount/unmount/passwd + charly start call
            the shim, which Invokes verb:enc in-proc so the passphrase never crosses a socket).
        plugin:
            providers:
                - verb:enc
            source: github.com/opencharly/plugin-enc/candy/plugin-enc
        plan:
            - check: the encrypted-volume mechanics plugin ships a buildable Go module the host compiles in
              id: enc-module-present
              context:
                - build
              command: "true"

# ---------------------------------------------------------------------------
# The verb/schema skills this repo's own candy owns — routing only.
#
# Each node carries `name`/`family`/`owner` (plus `triggers:` where the skill
# generates DISPATCHER.md rows). The prose is the skill FILE at
# `<repo root>/.agents/skills/<name>/SKILL.md`, never an inline `description:`
# or `content:` — an inline body that disagrees with its file is a hard error
# in the marketplace generator. `family:` is the marketplace family the skill
# was authored under, kept so every existing `/charly-<family>:<name>` address
# still resolves; `owner:` names the candy whose command/kind surface the
# skill documents. This candy composes no image, so these nodes add nothing to
# any `ai.opencharly.skill` OCI label; the bodies reach consumers through the
# generated marketplace corpus.
# ---------------------------------------------------------------------------
enc-skill:
  skill:
    name: enc
    family: automation
    owner: plugin-enc
    triggers:
      - "`charly config` encrypted volumes / gocryptfs / the `--encrypt` flag / config mount-unmount-status-passwd"
